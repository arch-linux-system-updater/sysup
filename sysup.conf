#
# sysup configuration
#
# System-wide: /etc/sysup.conf
# Per user:    ~/.config/sysup/sysup.conf   (create it with: sysup --edit-config)
#
# The per-user file is read after this one. Every line here is commented out
# and shows the built-in default. Uncomment a line to change it.
# This file is sourced by bash, so use plain VAR=value syntax.
#

#-- Packages -------------------------------------------------------------------
# AUR helper to use: auto | paru | yay | pikaur | trizen | pacman
#AUR_HELPER=auto
# Privilege tool: auto | sudo | doas | run0
#SUDO=auto
# Never ask questions, pass --noconfirm everywhere (same as: sysup -y)
#NOCONFIRM=no
# Also rebuild -git/VCS AUR packages (same as: sysup --devel)
#DEVEL=no
# Update archlinux-keyring before the main upgrade when a new one is out
#KEYRING=yes

#-- Before upgrading -----------------------------------------------------------
# Show Arch news published since your last upgrade and ask before continuing
#NEWS=yes
# Refresh the mirrorlist with reflector or rate-mirrors:
#   auto = only when the mirrorlist is older than MIRROR_MAX_AGE days
#MIRRORS=auto
#MIRROR_MAX_AGE=14

#-- Other package sources ------------------------------------------------------
#FLATPAK=yes
#SNAP=yes
# Firmware via fwupd: check (only report) | yes (install) | no
#FIRMWARE=check

#-- User-level updates ---------------------------------------------------------
# rustup, cargo install-update, pipx, uv tools, npm globals (user prefix only),
# bun, deno, gh extensions, tldr pages
#DEVTOOLS=yes
# oh-my-zsh, fisher, tmux tpm, lazy.nvim
#PLUGINS=yes
# Dotfile/desktop frameworks (Caelestia, ...)
#DOTFILES=yes

#-- Cleanup --------------------------------------------------------------------
#CLEAN=yes
# Remove orphaned packages: ask | yes | no
#ORPHANS=ask
# Versions of each package to keep in /var/cache/pacman/pkg
#PKG_CACHE_KEEP=2
#PKG_CACHE_KEEP_UNINSTALLED=0
# Prune paru/yay build caches (old builds, build trees, removed packages)
#AUR_CACHE=yes
#JOURNAL_MAX_SIZE=500M
#JOURNAL_MAX_AGE=4weeks
# Delete cached thumbnails not used for this many days
#THUMBNAIL_MAX_AGE=30

# Deep clean (same as: sysup -d): pip/uv/npm/yarn/pnpm/go/cargo caches,
# dangling docker/podman images, old coredumps, old items in the trash
#DEEP_CLEAN=no
#TRASH_MAX_AGE=30
#COREDUMP_MAX_AGE=7

#-- After upgrading ------------------------------------------------------------
# .pacnew files, failed services, reboot needed, optimisation tips
#CHECKS=yes

#-- Your own stuff -------------------------------------------------------------
# Commands run (in order) after everything else. Executable scripts in
# ~/.config/sysup/hooks.d/ are run too. Both get these environment variables:
# SYSUP_HELPER, SYSUP_NOCONFIRM, SYSUP_DRY_RUN
#EXTRA_COMMANDS=(
#    "hyprpm update"
#    "doom upgrade"
#)

# Steps to always skip. Run `sysup --list-steps` for the names.
#SKIP_STEPS=(snap firmware)
